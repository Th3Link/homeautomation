name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .github/workflows/audit.yml
  schedule:
    # Catch newly published advisories against dependencies that haven't
    # changed. On this trigger rustsec/audit-check files a GitHub issue per
    # advisory instead of failing a check.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: ${{ matrix.crate }} / advisories
    runs-on: ubuntu-latest
    permissions:
      checks: write
      issues: write
    strategy:
      matrix:
        crate:
          - common-core
          - common-hardware
          - gateway-core
          - gateway-hardware
          - cancomponents-core
          - cancomponents-hardware
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: software/${{ matrix.crate }}

  # License compliance: this project is GPL-3.0-or-later, so every
  # dependency's license needs to actually be compatible with that. See
  # each crate's own deny.toml for the allow-list — a new dependency with
  # an unreviewed license fails this instead of silently being distributed
  # under it.
  licenses:
    name: ${{ matrix.crate }} / licenses
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate:
          - common-core
          - common-hardware
          - gateway-core
          - gateway-hardware
          - cancomponents-core
          - cancomponents-hardware
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: software/${{ matrix.crate }}/Cargo.toml
          command-arguments: licenses
