name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push wins over one still in
# flight rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  # The *-core crates carry the project documentation itself (requirements,
  # ADRs, the CAN/MQTT protocol specs, technical debt — see each crate's
  # src/docs.rs) alongside their own API docs, and build on plain stable
  # Rust.
  docs-core:
    name: docs / ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [common-core, gateway-core, cancomponents-core]
    defaults:
      run:
        working-directory: software/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
      - uses: actions/upload-artifact@v7
        with:
          name: docs-${{ matrix.crate }}
          path: target/doc

  # The *-hardware crates only have their own API docs (no project
  # documentation of their own) but are published alongside the *-core
  # crates' for completeness — they need the pinned "esp" toolchain
  # channel, same as building them.
  docs-hardware:
    name: docs / ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [common-hardware, gateway-hardware, cancomponents-hardware]
    defaults:
      run:
        working-directory: software/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v5
      - uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: esp32
          version: "1.97.0"
      - run: cargo doc --no-deps
      - uses: actions/upload-artifact@v7
        with:
          name: docs-${{ matrix.crate }}
          path: target/xtensa-esp32-none-elf/doc

  # Combines every crate's doc output into one site with a landing page,
  # since they're built by different jobs (different toolchains) and
  # can't share a `target/doc` directory.
  build-site:
    name: docs / assemble site
    needs: [docs-core, docs-hardware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: docs-common-core
          path: site/common-core
      - uses: actions/download-artifact@v8
        with:
          name: docs-common-hardware
          path: site/common-hardware
      - uses: actions/download-artifact@v8
        with:
          name: docs-gateway-core
          path: site/gateway-core
      - uses: actions/download-artifact@v8
        with:
          name: docs-gateway-hardware
          path: site/gateway-hardware
      - uses: actions/download-artifact@v8
        with:
          name: docs-cancomponents-core
          path: site/cancomponents-core
      - uses: actions/download-artifact@v8
        with:
          name: docs-cancomponents-hardware
          path: site/cancomponents-hardware
      - name: Write landing page
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>homeautomation docs</title>
          </head>
          <body>
            <h1>homeautomation</h1>
            <p>A CAN-bus home-automation system — see each crate below for
            its own documentation, or start with
            <a href="gateway-core/gateway_core/index.html">gateway-core</a>,
            which embeds the requirements/ADR/protocol docs (via its
            <code>docs</code> module) alongside its API reference.</p>
            <h2>The gateway (CAN&lt;-&gt;MQTT bridge)</h2>
            <ul>
              <li>
                <a href="gateway-core/gateway_core/index.html">gateway-core</a>
                &mdash; requirements, ADRs, CAN/MQTT protocol specs, technical
                debt, and the crate's own API reference
              </li>
              <li>
                <a href="gateway-hardware/gateway_hardware/index.html">gateway-hardware</a>
                &mdash; firmware API reference
              </li>
            </ul>
            <h2>CAN nodes (relays, rollershutters, buttons, lights)</h2>
            <ul>
              <li>
                <a href="cancomponents-core/cancomponents_core/index.html">cancomponents-core</a>
                &mdash; the crate's own API reference
              </li>
              <li>
                <a href="cancomponents-hardware/cancomponents/index.html">cancomponents-hardware</a>
                &mdash; firmware API reference
              </li>
            </ul>
            <h2>Shared crates</h2>
            <ul>
              <li>
                <a href="common-core/common_core/index.html">common-core</a>
                &mdash; the CAN wire-format types shared by both firmware lines
              </li>
              <li>
                <a href="common-hardware/common_hardware/index.html">common-hardware</a>
                &mdash; shared ESP32 hardware-support helpers
              </li>
            </ul>
          </body>
          </html>
          HTML
      # Firmware memory history, one point per main commit — written by
      # ci.yml's firmware-history job onto the `metrics` branch. Absent until
      # the first main push after that landed; the page is just skipped then.
      - uses: actions/checkout@v5
        id: metrics
        continue-on-error: true
        with:
          ref: metrics
          path: metrics-branch
      - name: Render firmware memory history
        if: steps.metrics.outcome == 'success'
        run: |
          python3 .github/scripts/memory_report.py chart \
            --history metrics-branch/history.json \
            --out site/firmware-memory/index.html
          python3 - <<'PY'
          p = "site/index.html"
          s = open(p).read()
          s = s.replace("</body>", """<h2>Firmware memory</h2>
            <ul><li><a href="firmware-memory/index.html">History</a>
            &mdash; flash image, static DRAM and stack budget per commit on main</li></ul>
          </body>""")
          open(p, "w").write(s)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: docs / deploy
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
