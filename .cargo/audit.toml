# cargo-audit config — read by the "Security audit" workflow's
# rustsec/audit-check from the repository root.
#
# embedded-tls still brings in crypto-bigint 0.5. The gateway's Rust
# device signing key uses p256 0.14 on the fixed crypto-bigint 0.7 line.
# See gateway-hardware/src/cert/key.rs and gateway-hardware/src/tls.rs.

[advisories]
ignore = [
    # crypto-bigint < 0.7.6: timing variability in operations meant to be constant-time.
    "RUSTSEC-2026-0387",
]
