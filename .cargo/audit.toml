# cargo-audit config — read by the "Security audit" workflow's
# rustsec/audit-check from the repository root.
#
# Both advisories below are about *secret-dependent* operations (private-key
# decryption/signing, secret scalars). The gateway only ever *verifies*
# signatures against the broker's public key it pinned (the TLS code in
# gateway-hardware/src/tls.rs), which handles no secret, so the timing side
# channels have nothing to leak. Neither can be fixed from here: `rsa` has no
# fixed release, and the crypto-bigint 0.5 line is what `embedded-tls`,
# `p256` and `p384` (all RustCrypto 0.13/0.16) are built on. Drop an entry
# once its advisory can be fixed by a dependency update.

[advisories]
ignore = [
    # rsa: "Marvin Attack" — timing side channel in RSA *private key* operations.
    "RUSTSEC-2023-0071",
    # crypto-bigint < 0.7.6: timing variability in operations meant to be constant-time.
    "RUSTSEC-2026-0387",
]
