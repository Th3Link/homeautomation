[package]
name = "gateway-hardware"
description = "ESP32 mqtt-gateway firmware (esp-hal + embassy)"
edition.workspace = true
version = "0.1.0"
license.workspace = true
build = "build.rs"
# Informational only: gateway-hardware builds with the pinned "esp" rustup
# channel (see rust-toolchain.toml), a custom Xtensa fork of nightly, not a
# stable release. `cargo-msrv` cannot verify this value against that
# toolchain, so it's kept in sync with gateway-core's MSRV by hand.
rust-version.workspace = true

[[bin]]
name = "gateway-hardware"
path = "./src/bin/main.rs"

[dependencies]
critical-section = { version = "1.2" }
esp-hal = { version = "1.2.2", features = ["esp32", "unstable"] }
esp-println = { version = "0.18", features = ["esp32"] }
esp-backtrace = { version = "0.20", features = ["esp32", "println", "panic-handler", "custom-halt"] }
esp-hal-ota = { version = "0.6", features = ["esp32"] }
esp-storage = { version = "0.10", features = ["esp32", "embedded-storage"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32"] }
nb = { version = "1.1" }
embassy-executor = { version = "0.10" }
embassy-sync = { version = "0.8" }
embassy-time = { version = "0.5" }
embassy-futures = { version = "0.1" }
embassy-embedded-hal = { version = "0.6" }
esp-rtos = { version = "0.4", features = ["esp32", "embassy"] }
embedded-can = { version = "0.4" }
embedded-io-async = { version = "0.7" }
embedded-storage = { version = "0.3" }
static_cell = { version = "2.1", features = ["nightly"] }
heapless = { version = "0.9" }
async-trait = { version = "0.1" }
sequential-storage = { version = "8.0" }
bareminal_cli = { version = "0.3", default-features = false, features = ["async-no-std"] }
bareminal_macros = { version = "0.3" }
num_enum = { version = "0.7", default-features = false }
thiserror = { version = "2", default-features = false }
gateway-core = { path = "../gateway-core/" }
dhcpv6-client = { path = "../dhcpv6-client/" }
common-hardware = { path = "../common-hardware/" }
embassy-net = { version = "0.9.1", features = ["proto-ipv4", "dhcpv4", "dhcpv4-hostname", "slaac", "tcp", "udp", "dns", "medium-ethernet"] }
embassy-net-driver = { version = "0.2" }
rust-mqtt = { version = "0.6.0", default-features = false, features = ["bump", "v3", "v5"] }
# TLS 1.3 client for the mqtts:// brokers. The server's identity is checked
# by src/tls.rs itself (against a pinned public key), with these ECDSA crates.
embedded-tls = { version = "0.19", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "sha256"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "sha384"] }
sha2 = { version = "0.11", default-features = false }
# RSA-PSS signatures (most brokers' certificates are RSA) need a heap.
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
esp-alloc = { version = "0.11.0", features = ["esp32"] }
picoserve = { version = "0.20.1", features = ["embassy", "json"] }
# TLS for the web server (HTTPS) and the EST client, ADR 0018. embedded-tls
# above has no server side. Built from source with the Xtensa GCC
# (`use-gcc`; the prebuilt libraries don't fit the record sizes and the
# wall-clock hook), which needs cmake and ninja on the build host. The
# record buffers: 16 KiB in (a browser sends full records, e.g. a firmware
# upload), 8 KiB out (must hold the certificate chain in one message).
mbedtls-rs = { version = "0.3", default-features = false, features = [
    "esp32",
    "embassy-time",
    "use-gcc",
    "hook-wall-clock",
    "ssl-in-content-len-16384",
    "ssl-out-content-len-8192",
    "tls-engine",
    "tls-core",
    "tls-client",
    "tls-server",
    "tls-proto-tls12",
    "tls-proto-tls13",
    "kex-ecdhe-ecdsa",
    "kex-ecdhe-rsa",
    "alg-sha256",
    "alg-sha512",
    "alg-aes",
    "alg-gcm",
    "alg-hkdf",
    "alg-ecp",
    "alg-ecdh",
    "alg-ecdsa",
    "alg-rsa",
    "alg-rsa-pss",
    "pk",
    "curve-secp256r1",
    "curve-secp384r1",
    "curve-curve25519",
    "drbg-ctr",
    "entropy",
    "base64",
    "pem-parse",
    "x509-parse",
] }
# The RNG interface mbedtls-rs takes (see src/https.rs).
rand_core = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.7", default-features = false }

[build-dependencies]
vergen-git2 = { version = "10", features = ["build", "cargo", "rustc", "si"] }

# [profile.*] must live in the workspace root manifest (../Cargo.toml) —
# Cargo ignores profile sections in member manifests.
