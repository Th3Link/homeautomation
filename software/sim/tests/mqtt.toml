# The MQTT tests copy this topology and allocate their own localhost ports.
# Create its two dedicated CAN interfaces with ./sim -f tests/mqtt.toml net.

[[gateway]]
name = "gw-a"
bus = "vcan-mqtt-a"
https = 8643
http = 8280
console = ["mqtt-uri mqtt://10.0.2.2:18883", "mqtt-enabled on", "ha-discovery on"]

[[gateway]]
name = "gw-b"
bus = "vcan-mqtt-b"
https = 8644
http = 8281
console = ["mqtt-uri mqtt://10.0.2.2:18883", "mqtt-enabled on", "ha-discovery on"]

[[node]]
name = "tastera"
type = "button"
id = 10
gateway = "gw-a"
extension = "sensors"
console = ["sensor-interval 10"]

[[node]]
name = "relaya"
type = "relay"
id = 128
gateway = "gw-a"

[[node]]
name = "tasterb"
type = "button"
id = 20
gateway = "gw-b"
extension = "sensors"
console = ["sensor-interval 10"]

[[node]]
name = "relayb"
type = "relay"
id = 129
gateway = "gw-b"
