name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: gateway-hardware / release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-hardware
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: esp32
          version: "1.97.0"
      - name: Install espflash
        # Needed by build.rs, which shells out to `espflash save-image` to
        # turn the linked ELF into a flashable raw image
        # (gateway-hardware.bin).
        run: |
          curl -sSL -o /tmp/espflash.zip "https://github.com/esp-rs/espflash/releases/latest/download/espflash-x86_64-unknown-linux-gnu.zip"
          unzip -o /tmp/espflash.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/espflash"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install cargo-sbom
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/cargo-sbom" "https://github.com/psastras/sbom-rs/releases/download/cargo-sbom-latest/cargo-sbom-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/cargo-sbom"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo build --release
      - name: Generate SPDX SBOM
        run: cargo-sbom --output-format=spdx_json_2_3 --project-directory . > gateway-hardware.spdx.json
      - name: Stage release assets
        run: |
          mkdir -p dist
          cp "target/xtensa-esp32-none-elf/release/gateway-hardware" "dist/gateway-hardware-${{ github.ref_name }}.elf"
          cp "target/xtensa-esp32-none-elf/release/gateway-hardware.bin" "dist/gateway-hardware-${{ github.ref_name }}.bin"
          cp gateway-hardware.spdx.json "dist/gateway-hardware-${{ github.ref_name }}.spdx.json"
      - uses: softprops/action-gh-release@v3
        with:
          files: gateway-hardware/dist/*
          generate_release_notes: true
