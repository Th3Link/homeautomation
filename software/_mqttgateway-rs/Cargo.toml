[workspace]
resolver = "2"
members = ["gateway-core", "gateway-hardware"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.97"

# Cargo only reads [profile.*] from the workspace root, not from member
# manifests — these apply to gateway-hardware (gateway-core's tests always
# build in the default host dev/test profiles).
[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.dev.package.esp-storage]
opt-level = 3

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
