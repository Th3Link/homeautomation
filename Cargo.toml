[workspace]
resolver = "2"
members = [
    "software/common-core",
    "software/common-hardware",
    "software/gateway-core",
    "software/gateway-hardware",
    "software/cancomponents-core",
    "software/cancomponents-hardware",
]

# Forks of upstream releases with the fixes the gateway needs, until
# upstream releases them; software/patches/README.md tracks them.
[patch.crates-io]
# Fork: no TX checksum insertion by the ESP32's MAC; branch
# esp-hal-v1.2.2-gateway.
esp-hal = { git = "https://github.com/Th3Link/esp-hal", rev = "475cf2f76be9b03acf8da92b66b466c2ccf0d051" }
# Fork: every SLAAC address, RDNSS, the M/O flags, a DHCPv6 lease; branch
# embassy-net-v0.9.1-gateway.
embassy-net = { git = "https://github.com/Th3Link/embassy", rev = "8b544c3c4d8b5952073420d17396e30700c46190" }
# Fork with the SLAAC fixes (multiple prefixes, M/O flags, RDNSS); branch
# v0.13.1-gateway.
smoltcp = { git = "https://github.com/Th3Link/smoltcp", rev = "dfe04756328dac94bc227c1e6f151280a13e24d4" }
# Fork: server authentication required before Finished (upstream #215,
# backported), the TLS exporter (NTS keys, ADR 0023); branch
# embedded-tls-v0.19.0-gateway.
embedded-tls = { git = "https://github.com/Th3Link/embedded-tls", rev = "1531c9e1f4868415686b0a8322425e08e824e53c" }

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.97"

# Cargo only reads [profile.*] from the workspace root, not from member
# manifests — these apply to the *-hardware crates (the *-core crates'
# tests always build in the default host dev/test profiles).
[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.dev.package.esp-storage]
opt-level = 3

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
